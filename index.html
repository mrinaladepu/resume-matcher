<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resume Matcher - Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS (Optional) -->
    <link rel="stylesheet" href="styles.css">

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">Resume Matcher</a>
            <div class="navbar-nav ms-auto">
                <button id="loginBtn" class="btn btn-outline-light me-2">Login</button>
                <button id="registerBtn" class="btn btn-outline-light">Register</button>
                <button id="logoutBtn" class="btn btn-outline-light" style="display:none;">Logout</button>
            </div>
        </div>
    </nav>

    <!-- AUTH FORM -->
    <div class="d-flex justify-content-center align-items-center vh-100">
        <div class="card shadow p-4" style="width:350px;">
            <h3 class="text-center mb-3" id="authTitle">Login</h3>

            <form id="authForm">
                <input type="text" id="username" placeholder="Username or Email" class="form-control mb-2" required>
                <input type="password" id="password" placeholder="Password" class="form-control mb-2" required>

                <!-- Email visible only during registration -->
                <input type="email" id="email" placeholder="Email" class="form-control mb-2" style="display:none;">

                <button type="submit" id="authSubmitBtn" class="btn btn-primary w-100">Login</button>
                <button type="button" id="switchAuthMode" class="btn btn-link w-100">Need to register?</button>
                <button type="button" id="forgotPasswordBtn" class="btn btn-link text-danger w-100">Forgot Password?</button>
            </form>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
