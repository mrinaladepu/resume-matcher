<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - AI Resume Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        .candidate-info {
            font-size: 0.9rem;
        }
        .contact-info {
            background: #f8f9fa;
            padding: 8px;
            border-radius: 5px;
            margin: 2px 0;
        }
        .status-badge {
            font-size: 0.8rem;
            padding: 4px 8px;
        }
        .table-hover tbody tr:hover {
            background-color: rgba(0, 123, 255, 0.1);
        }
        .stat-card {
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        .stat-card.active {
            border-color: rgba(255,255,255,0.8);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }
        .active-filter-indicator {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #fff;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-robot me-2"></i>AI Resume Analyzer - Admin
            </a>
            <div class="navbar-nav ms-auto">
                <a href="resume.html" class="btn btn-outline-light me-2">
                    <i class="fas fa-user me-1"></i>User Portal
                </a>
                <button id="logoutBtn" class="btn btn-outline-light">
                    <i class="fas fa-sign-out-alt me-1"></i>Logout
                </button>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <div class="d-flex justify-content-between align-items-center">
                    <h2 class="mb-0"><i class="fas fa-tachometer-alt me-2"></i>Admin Dashboard</h2>
                    <div>
                        <button id="exportBtn" class="btn btn-success">
                            <i class="fas fa-download me-1"></i>Export Shortlisted
                        </button>
                    </div>
                </div>
            </div>
            <div class="card-body">

                <!-- Stats -->
                <div class="row mb-4">
                    <div class="col-md-3">
                        <div class="card text-center p-3 bg-primary text-white stat-card active" data-filter="all">
                            <div class="position-relative">
                                <h5><i class="fas fa-users me-2"></i>Total Applications</h5>
                                <p id="totalApplications" class="fs-3 mb-0">-</p>
                                <div class="active-filter-indicator">
                                    <i class="fas fa-filter text-primary"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card text-center p-3 bg-success text-white stat-card" data-filter="shortlisted">
                            <h5><i class="fas fa-star me-2"></i>Shortlisted</h5>
                            <p id="shortlistedResumes" class="fs-3 mb-0">-</p>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card text-center p-3 bg-warning text-white stat-card" data-filter="under review">
                            <h5><i class="fas fa-clock me-2"></i>Under Review</h5>
                            <p id="underReviewResumes" class="fs-3 mb-0">-</p>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card text-center p-3 bg-danger text-white stat-card" data-filter="rejected">
                            <h5><i class="fas fa-times me-2"></i>Rejected</h5>
                            <p id="rejectedResumes" class="fs-3 mb-0">-</p>
                        </div>
                    </div>
                </div>

                <!-- Job Applications Table -->
                <h3><i class="fas fa-briefcase me-2"></i>Job Applications</h3>
                <div class="mb-3">
                    <small class="text-muted" id="filterStatusText">Showing all applications</small>
                </div>
                
                <div class="table-responsive">
                    <table class="table table-striped table-hover" id="jobApplicationsTable">
                        <thead class="table-dark">
                            <tr>
                                <th>Candidate Details</th>
                                <th>Contact Information</th>
                                <th>Job Role</th>
                                <th>Match Score</th>
                                <th>Status</th>
                                <th>Applied Date</th>
                                <th>Skills</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="jobApplicationsBody"></tbody>
                    </table>
                </div>

            </div>
        </div>
    </div>

    <!-- Candidate Details Modal -->
    <div class="modal fade" id="candidateModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="candidateModalTitle">Candidate Details</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="candidateModalBody">
                    <!-- Details will be loaded here -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="admin.js"></script>
</body>
</html>
